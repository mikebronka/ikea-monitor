services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ikea_monitor
      POSTGRES_USER: ikea
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikea -d ikea_monitor"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      target: base
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ikea:${DB_PASSWORD:-devpassword}@db:5432/ikea_monitor
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      TO_EMAIL: ${TO_EMAIL:-}
      SCRAPER_CRON: ${SCRAPER_CRON:-0 8 * * *}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/code/app
      - ./backend/alembic:/code/alembic
      - ./backend/alembic.ini:/code/alembic.ini
      - ./backend/scripts:/code/scripts
      - ./data:/code/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
